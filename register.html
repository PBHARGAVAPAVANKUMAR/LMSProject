<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>EduPortal - Register</title>

    <link rel="stylesheet" href="style.css">

</head>

<body class="auth-page">


    <!-- HEADER -->

    <header class="site-header">

        <a class="logo" href="index.html">
            🎓 EduPortal
        </a>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="login.html">
                Login
            </a>

            <a class="active" href="register.html">
                Register
            </a>

        </nav>

    </header>


    <!-- REGISTER -->

    <main class="auth-wrapper">

        <div class="auth-card">

            <div class="auth-brand">
                📝
            </div>

            <h1>
                Create Account
            </h1>

            <p class="muted">
                Join EduPortal and start learning.
            </p>


            <form id="register-form">

                <label>
                    Full Name
                </label>

                <input
                    id="reg-name"
                    type="text"
                    placeholder="Your full name"
                    required
                >


                <label>
                    Email Address
                </label>

                <input
                    id="reg-email"
                    type="email"
                    placeholder="you@example.com"
                    required
                >


                <label>
                    Password
                </label>

                <input
                    id="reg-password"
                    type="password"
                    minlength="4"
                    placeholder="Create a password"
                    required
                >


                <label>
                    Role
                </label>

                <select id="reg-role">

                    <option value="Student">
                        Student
                    </option>

                    <option value="Instructor">
                        Instructor
                    </option>

                </select>


                <button
                    class="btn full"
                    type="submit"
                >
                    Create Account
                </button>

            </form>


            <p class="auth-link">

                Already registered?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </main>


    <script src="js/script.js"></script>

</body>

</html>
