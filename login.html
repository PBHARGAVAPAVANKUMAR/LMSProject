<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>EduPortal - Login</title>

    <link rel="stylesheet" href="Style.css">

</head>

<body class="auth-page">


    <!-- HEADER -->
    <header class="site-header">

        <a class="logo" href="index.html">
            🎓 EduPortal
        </a>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a class="active" href="login.html">
                Login
            </a>

            <a href="register.html">
                Register
            </a>

        </nav>

    </header>


    <!-- LOGIN -->
    <main class="auth-wrapper">

        <div class="auth-card">

            <div class="auth-brand">
                🎓
            </div>

            <h1>
                Welcome Back
            </h1>

            <p class="muted">
                Login to continue learning.
            </p>


            <form id="login-form">

                <label>
                    Email Address
                </label>

                <input
                    id="login-email"
                    type="email"
                    placeholder="you@example.com"
                    required
                >


                <label>
                    Password
                </label>

                <input
                    id="login-password"
                    type="password"
                    placeholder="••••••••"
                    required
                >


                <button
                    class="btn full"
                    type="submit"
                >
                    Login
                </button>

            </form>


            <p class="auth-link">

                Don't have an account?

                <a href="register.html">
                    Create one
                </a>

            </p>


            <div class="demo-box">

                <strong>Demo:</strong>

                Any valid email/password works.

                Add

                <b>instructor</b>

                anywhere in the email to open
                the instructor dashboard.

            </div>

        </div>

    </main>


    <script src="js/script.js"></script>

</body>

</html>
